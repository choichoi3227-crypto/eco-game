name = "eco-game"
compatibility_date = "2026-06-16"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "ecogame-db"
database_id = "f70551f2-c157-4e18-87b4-f2b41d67393d"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "df28f4248d584c94a92a9d70bc16b4e6"

[[durable_objects.bindings]]
name = "GITHUB_QUEUE_DO"
class_name = "GitHubQueueDO"

[[migrations]]
tag = "v1"
new_classes = ["GitHubQueueDO"]

[triggers]
crons = ["0 * * * *"]

[vars]
GITHUB_REPO_OWNER = "choichoi3227-crypto"
GITHUB_REPO_NAME = "eco-game"
# GITHUB_TOKEN, JWT_SECRET, DISCORD_WEBHOOK_URL 등은 대시보드 Secrets에 저장하세요.
